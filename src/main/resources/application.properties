spring.application.name=icecube-neutrino-alerts-practice
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/icecube?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.icecube.platform.u202417747.shared.infrastructure.persistence.jpa.strategy.SnakeCasePluralNamingStrategy
spring.messages.basename=messages
spring.messages.encoding=UTF-8
springdoc.swagger-ui.path=/swagger-ui.html
